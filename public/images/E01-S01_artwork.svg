<svg width="3000" height="3000" viewBox="0 0 3000 3000" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="3000" height="3000" fill="#f7f1e9" />

    <!-- Title -->
    <text
        x="1500" y="600"
        text-anchor="middle"
        font-family="sans-serif"
        font-weight="bold"
        font-size="180px"
        fill="#3c2d21"
        direction="rtl"
    >S01-E01 – التسويق - مقدمة قصيرة جداً</text>

    <!-- Megaphone icon -->
    <!-- Cone -->
    <polygon points="1100,900 1100,1300 1400,1150" fill="#3c2d21" />
    <!-- Handle -->
    <rect x="1050" y="1300" width="100" height="300" fill="#3c2d21" />
    <!-- Back circle -->
    <circle cx="1100" cy="900" r="150" fill="none" stroke="#3c2d21" stroke-width="100" />
    <!-- Sound lines -->
    <path d="M1400,1100 L1550,1000" stroke="#3c2d21" stroke-width="50" stroke-linecap="round" />
    <path d="M1400,1200 L1600,1200" stroke="#3c2d21" stroke-width="50" stroke-linecap="round" />
    <path d="M1400,1300 L1550,1400" stroke="#3c2d21" stroke-width="50" stroke-linecap="round" />

    <!-- Description -->
    <text
        x="1500" y="1900"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="80px"
        fill="#3c2d21"
        direction="rtl"
    >
        <tspan x="1500" dy="0">تقدم هذه الحلقة الطبيعة الأساسية للتسويق.</tspan>
        <tspan x="1500" dy="100">نستكشف كيف أن التسويق موجود في كل مكان حولنا،</tspan>
        <tspan x="1500" dy="100">ويتضمن أكثر بكثير من مجرد الإعلان أو البيع.</tspan>
    </text>
</svg>